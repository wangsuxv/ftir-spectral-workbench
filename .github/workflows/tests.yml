name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked verification environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Regression and integration tests
        run: pytest -q -p no:cacheprovider
      - name: Static checks
        run: |
          ruff check src tests ui scripts
          mypy src/ftir_workbench --no-incremental
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps -w dist
