[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ftir-spectral-workbench"
version = "0.1.0"
description = "Auditable baseline correction and optional prepared-data-only 2D-COS for FTIR series"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "FTIR Spectral Workbench contributors" }]
keywords = ["FTIR", "spectroscopy", "baseline", "2D-COS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pybaselines>=1.2",
  "pydantic>=2.7",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
web = [
  "plotly>=5.18",
  "streamlit>=1.53",
]
desktop = ["PySide6>=6"]
dev = [
  "coverage[toml]>=7.5",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "plotly>=5.18",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "streamlit>=1.53",
]

[project.scripts]
ftir-workbench = "ftir_workbench.cli:main"
ftir-baseline = "ftir_baseline.cli:main"
ftir2dcos = "ftir2dcos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ftir_baseline", "src/ftir2dcos", "src/ftir_workbench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["ftir_baseline", "ftir2dcos", "ftir_workbench"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
packages = ["ftir_workbench"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "pybaselines", "scipy.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true
